name: analyze
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: analyze
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy requests
      - run: python scripts/analyze.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          REPO: ${{ github.repository }}
      - name: publish
        run: |
          mkdir /tmp/pub && cp out/signals.json /tmp/pub/
          cd /tmp/pub
          git init -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals.json
          git commit -m "update signals"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
